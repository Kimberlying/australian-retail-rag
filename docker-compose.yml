services:
  api:
    build: .
    image: australian-retail-rag:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: json
    restart: unless-stopped

  # Optional vector store: `docker compose --profile pgvector up` and set
  # RAG_VECTOR_STORE=pgvector, RAG_DATABASE_URL=postgresql://rag:rag@postgres:5432/rag
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
