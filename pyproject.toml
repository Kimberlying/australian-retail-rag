[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "australian-retail-rag"
version = "0.3.0"
description = "An explainable, evaluation-driven RAG system for Australian retail public data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
llm = ["anthropic>=1.0"]
embeddings = ["fastembed>=0.4"]
pdf = ["pypdf>=5.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]
all = [
  "australian-retail-rag[api,llm,pdf,embeddings]",
]

[project.scripts]
retail-rag = "retail_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "SIM",     # simplify
  "RUF",     # ruff-specific
  "PL",      # pylint subset
  "S",       # bandit (security)
]
ignore = [
  "PLR0913",  # many keyword args are fine for config-style functions
  "PLR2004",  # magic values are fine in metrics code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["retail_rag"]

[[tool.mypy.overrides]]
module = ["pypdf", "uvicorn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: calls the real Anthropic API (deselected unless ANTHROPIC_API_KEY is set)",
]

[tool.coverage.run]
source = ["retail_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
