name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Also run the evaluation against Claude (uses ANTHROPIC_API_KEY, costs tokens)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Shared across jobs so the embedding model (bge-small, ~70 MB) is downloaded once and cached.
  RAG_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Type-check against the minimum supported Python (mypy's python_version).
          # Newer interpreters resolve newer numpy whose stubs use 3.12-only syntax.
          python-version: "3.11"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=85
        env:
          RAG_TEST_REAL_MODEL: "1"

  eval:
    name: Retrieval quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      # Gates sit just under the committed hybrid baseline (evals/baselines/) so a
      # retrieval or refusal regression fails the build; raise them as the system improves.
      - name: Run golden-set evaluation (hybrid retriever)
        run: >
          uv run retail-rag eval --retriever hybrid
          --fail-under hit_rate=0.95
          --fail-under recall=0.93
          --fail-under mrr=0.90
          --fail-under refusal_accuracy=0.25
          --fail-over false_refusal_rate=0.0
      - name: Publish report to job summary
        if: always()
        run: cat reports/eval.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  live-eval:
    name: End-to-end evaluation with Claude
    if: github.event_name == 'workflow_dispatch' && inputs.live_eval
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Run evaluation with generation and LLM judge
        run: >
          uv run retail-rag eval --judge --stem eval-claude
          --fail-under refusal_accuracy=0.8
          --fail-under citation_validity=0.95
          --fail-under faithfulness=0.85
      - name: Publish report to job summary
        if: always()
        run: cat reports/eval-claude.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-claude
          path: reports/

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: australian-retail-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name rag -p 8000:8000 australian-retail-rag:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/query \
            -H 'content-type: application/json' \
            -d '{"question":"What was Coles normalised eCommerce sales growth in FY25?"}' \
            | tee response.json
          grep -q '23.3' response.json
      - name: Container logs
        if: always()
        run: docker logs rag
